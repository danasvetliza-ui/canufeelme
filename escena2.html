<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can U Feel Me? — Escena 2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; overflow:hidden; background:#0d0018; }

        /* ═══════════════════════════════════════════════════════
           CURSOR PERSONALIZADO — manito 2D dibujito, humana
           Dedo índice apuntando, mano con calidez.
           Hotspot en la punta del índice: 16 1
        ═══════════════════════════════════════════════════════ */
        /* Cursor UX — estilo poético. Usamos un cursor de sistema para pointer 
           pero con feedback visual fuerte en el CSS */
        .cur-hand { cursor: pointer !important; }
        .cur-hand:hover { cursor: pointer !important; }

        /* ═══════════════════════════════════════════════════════
           ESCENA — stage fijo 1920×1080, escalado al viewport
        ═══════════════════════════════════════════════════════ */
        #s2 {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #0d0018; /* fondo base de la escena */
        }

        #cinematic-vignette {
            position: absolute; inset: 0; z-index: 5;
            pointer-events: none !important;
            background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 35%, rgba(6, 1, 16, 0.40) 80%, rgba(3, 0, 10, 0.70) 100%);
            transition: opacity 1.5s ease, background 1.5s ease;
        }
        #s2.zoomed #cinematic-vignette {
            background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 18%, rgba(6, 1, 16, 0.65) 65%, rgba(3, 0, 10, 0.92) 100%);
        }

        #s2-stage {
            position: absolute;
            top: 50%; left: 50%;
            width: 1920px; height: 1080px;
            z-index: 20;
            /* Fallback CSS para que esté centrado; JS luego añade translate y scale */
            transform: translate(-50%, -50%);
        }

        /* Zoomer: hace el zoom cinematográfico hacia la almohada.
           transform-origin apunta al centro de la almohada/cabecera
           de la cama en el espacio de diseño. */
        #s2-zoomer {
            position: absolute;
            inset: 0;
            will-change: transform;
            /* Renderizado de alta calidad durante el zoom */
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transform-style: preserve-3d;
        }

        /* ── Layers ── */
        .layer {
            position: absolute;
            pointer-events: none;
            user-select: none;
            display: block;
            /* Trucos para mantener 4K/Crispness en el zoom */
            image-rendering: high-quality;
            -webkit-font-smoothing: antialiased;
            transform: translateZ(0);
        }

        /* Fondo — habitación sin muebles */
        #l-fondo {
            top: 0; left: 0;
            width: 1920px; height: 1080px;
            object-fit: cover;
            z-index: 1;
        }

        /* ── POSICIONAMIENTO DE ASSETS ──
           La cama va en la esquina inferior-izquierda del stage,
           con la cabecera visible en la parte superior de la cama.
           La cama.png muestra la cama en perspectiva 3/4.
           El pie de la cama toca el borde inferior-izquierdo.

           Cama.png tiene la cabecera (headboard) en la zona
           superior-derecha del asset (perspectiva 3/4 frontal).

           Colocamos la cama grande para que:
           - La parte inferior-izquierda toque el borde del stage
           - La cabecera quede visible en la zona superior de la cama
        */

        #l-cama {
            z-index: 2;
            left: -90px;
            top: 590px;
            width: 820px;
            height: auto;
        }

        /* Almohada — en la cabecera (zona superior de la cama).
           La cabecera de cama.png está en el sector
           superior-central del asset al 75-85% de su ancho.
           Con cama en left=-90, top=590, width=820:
           - Cabecera x aprox: -90 + 820*0.80 = 566px
           - Cabecera y aprox: 590 + 459*0.12 = 645px
           Posicionamos la almohada sobre esa área. */
        #l-almohada {
            z-index: 4;
            left: 355px;
            top: 580px;
            width: 270px;
            height: auto;
            transition: opacity 1.1s ease;
        }

        /* Remedio — SIEMPRE debajo de la almohada (z:3 < z:4).
           Acostado, más arriba, más al centro de la parte superior de la cama.
           Casi todo tapado por la almohada. */
        #l-remedio {
            z-index: 3;
            left: 430px;
            top: 628px;
            width: 64px;
            height: auto;
            opacity: 0;
            transition: opacity 1.3s ease;
            transform: rotate(82deg);
            transform-origin: center center;
        }

        /* ══════════════════════════════════════════════
           HOTSPOTS invisibles
        ══════════════════════════════════════════════ */
        .hotspot {
            position: absolute;
            background: rgba(0, 0, 0, 0.001);
            pointer-events: none !important;
            z-index: 20;
        }
        .hotspot.active {
            pointer-events: auto !important;
            cursor: pointer !important;
        }

        /* Cama: cubre toda la zona de la cama */
        #hs-cama {
            left: -90px; top: 590px;
            width: 820px; height: 460px;
        }
        /* Almohada */
        #hs-almohada {
            left: 330px; top: 555px;
            width: 320px; height: 230px;
        }
        /* Remedio — hotspot cubre el frasco acostado y su zona visible */
        #hs-remedio {
            left: 388px; top: 608px;
            width: 165px; height: 175px;
        }

        /* ══════════════════════════════════════════════
           ANIMACIÓN — CAMA: RESPIRACIÓN LENTA
           Pulsación visible para guiar al usuario (UX estético).
        ══════════════════════════════════════════════ */
        @keyframes unifiedBreathe {
            0%, 100% { filter: brightness(1.02) drop-shadow(0 0 6px rgba(180,140,255,0.20)); }
            50%      { filter: brightness(1.22) drop-shadow(0 0 22px rgba(195,155,255,0.55)); }
        }
        @keyframes unifiedBreatheHvr {
            0%, 100% { filter: brightness(1.15) drop-shadow(0 0 12px rgba(190,150,255,0.40)); }
            50%      { filter: brightness(1.35) drop-shadow(0 0 32px rgba(215,175,255,0.80)); }
        }
        #l-cama.breathing        { animation: unifiedBreathe    3.2s ease-in-out infinite; cursor: pointer !important; pointer-events: auto !important; }
        #l-cama.breathing.hvr    { animation: unifiedBreatheHvr 2.0s ease-in-out infinite; cursor: pointer !important; }
        #l-cama.stop-anim {
            animation: none;
            filter: brightness(1.1);
            transition: filter 1.6s ease;
        }

        /* ══════════════════════════════════════════════
           ANIMACIÓN — ALMOHADA: DESTELLO LUMINOSO
        ══════════════════════════════════════════════ */
        @keyframes pillowGlow {
            0%, 100% { filter: brightness(1.1) drop-shadow(0 0 15px rgba(220,180,255,0.6)); }
            50%      { filter: brightness(1.6) saturate(1.3) drop-shadow(0 0 45px rgba(235,190,255,1)) drop-shadow(0 0 80px rgba(180,120,255,0.8)); }
        }
        @keyframes pillowGlowHvr {
            0%, 100% { filter: brightness(1.3) drop-shadow(0 0 25px rgba(230,180,255,0.8)); }
            50%      { filter: brightness(1.8) saturate(1.4) drop-shadow(0 0 65px rgba(255,210,255,1)) drop-shadow(0 0 100px rgba(200,130,255,0.9)); }
        }
        #l-almohada.glowing      { animation: pillowGlow    3.0s ease-in-out infinite; cursor: pointer !important; pointer-events: auto !important; }
        #l-almohada.glowing.hvr  { animation: pillowGlowHvr 2.1s ease-in-out infinite; cursor: pointer !important; }

        /* ══════════════════════════════════════════════
           ANIMACIÓN — REMEDIO: LATIDO CÁLIDO NARANJA
        ══════════════════════════════════════════════ */
        @keyframes remedioHeartbeat {
            0%, 100% { filter: brightness(1.1) drop-shadow(0 0 12px rgba(255,165,50,0.5)); }
            42%      { filter: brightness(1.5) drop-shadow(0 0 35px rgba(255,165,50,0.95)) drop-shadow(0 0 70px rgba(255,120,0,0.7)); }
            62%      { filter: brightness(1.3) drop-shadow(0 0 20px rgba(255,165,50,0.7)); }
        }
        @keyframes remedioHbHvr {
            0%, 100% { filter: brightness(1.3) drop-shadow(0 0 25px rgba(255,165,50,0.8)); }
            50%      { filter: brightness(1.8) drop-shadow(0 0 55px rgba(255,175,60,1)) drop-shadow(0 0 90px rgba(255,120,0,0.85)); }
        }
        #l-remedio.discovered      { animation: remedioHeartbeat 2.5s ease-in-out infinite; cursor: pointer !important; pointer-events: auto !important; }
        #l-remedio.discovered.hvr  { animation: remedioHbHvr     1.9s ease-in-out infinite; cursor: pointer !important; }

        /* ══════════════════════════════════════════════
           REMEDIO FOREGROUND — para el zoom hacia cámara
        ══════════════════════════════════════════════ */
        #remedio-fg {
            position: fixed;
            z-index: 500;
            pointer-events: none;
            opacity: 0;
            background: transparent; /* fondo transparente — se ve la habitación */
            transform-origin: center center;
            will-change: transform, opacity;
        }
        #remedio-fg img {
            width: 100%; height: 100%;
            object-fit: contain;
            display: block;
            background: transparent;
        }

        #remedio-spotlight {
            position: fixed; inset: 0; z-index: 490;
            background: radial-gradient(circle at 50% 50%, rgba(55, 20, 95, 0.50) 0%, rgba(13, 0, 24, 0.85) 60%, rgba(5, 0, 12, 0.96) 100%);
            opacity: 0; pointer-events: none; display: none;
            transition: opacity 1.4s ease;
        }
        #remedio-spotlight.visible { display: block; opacity: 1; }

        @keyframes remedioGifFloat {
            0%, 100% { transform: scale(1) translateY(0px); filter: drop-shadow(0 15px 35px rgba(160,110,255,0.25)) contrast(1.04) saturate(1.06) brightness(1.01); }
            50%      { transform: scale(1.02) translateY(-10px); filter: drop-shadow(0 25px 45px rgba(190,140,255,0.45)) contrast(1.06) saturate(1.08) brightness(1.03); }
        }
        #remedio-gif.visible img {
            animation: remedioGifFloat 4.5s ease-in-out infinite;
        }

        /* ══════════════════════════════════════════════
           GIF FINAL — transparente, se ve la habitación
        ══════════════════════════════════════════════ */
        #remedio-gif {
            position: fixed;
            inset: 0;
            z-index: 600;
            background: transparent; /* SIN fondo — se ve la habitación */
            opacity: 0;
            pointer-events: none;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        #remedio-gif.visible {
            display: flex;
            pointer-events: auto;
        }
        #remedio-gif img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            background: transparent;
            /* Renderizado de alta calidad + micro-sharpen */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: high-quality;
            filter: contrast(1.04) saturate(1.06) brightness(1.01);
        }

        /* Hint sutil para el click de retorno (aparece tarde, muy tenue) */
        #return-hint {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 610;
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 13px;
            letter-spacing: 0.25em;
            color: rgba(255,255,255,0.28);
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease;
            user-select: none;
        }
        #return-hint.visible { opacity: 1; }

        /* ══════════════════════════════════════════════
           FADE DE ENTRADA — animación CSS pura
           No depende del JS: se desvanece sola en 0.9s
        ══════════════════════════════════════════════ */
        @keyframes fadeOutIntro {
            0%   { opacity: 1; }
            100% { opacity: 0; pointer-events: none; }
        }
        #intro-fade {
            position: fixed;
            inset: 0;
            background: #0d0018;
            z-index: 900;
            pointer-events: none !important;
            opacity: 1;
            animation: fadeOutIntro 0.9s ease 0.2s forwards;
        }
        #intro-fade.gone { opacity: 0 !important; animation: none !important; display: none !important; pointer-events: none !important; }

        /* ══════════════════════════════════════════════
           ESCENA 3 — ESCRITORIO, LÁMPARA, CUADERNO
           Mismo cuarto, zona derecha. Activable luego
           de la primera interacción con la cama.
        ══════════════════════════════════════════════ */
        #l-escritorio {
            z-index: 2;
            left: 862px; top: 540px;
            width: 616px; height: auto;
        }
        #l-lampara {
            z-index: 6;
            left: 940px; top: 420px;
            width: 320px; height: auto;
            transition: filter 0.6s ease;
        }
        #l-lampara.lamp-hvr,
        #l-lampara:hover {
            filter: brightness(1.15) drop-shadow(0 0 16px rgba(255, 220, 160, 0.50));
        }
        #l-lampara.lamp-on {
            filter: brightness(1.35) drop-shadow(0 0 35px rgba(255, 210, 150, 0.75));
        }
        #l-lampara.lamp-on.lamp-hvr,
        #l-lampara.lamp-on:hover {
            filter: brightness(1.45) drop-shadow(0 0 45px rgba(255, 225, 170, 0.90));
        }


        /* Biblioteca + libros — pared derecha, según imagen de referencia */
        #l-biblioteca {
            z-index: 3;
            right: -80px;
            top: 170px;
            width: 640px;
            height: auto;
            filter: brightness(0.82) saturate(0.90);
        }
        /* Libros sueltos — estante del medio de la biblioteca */
        #l-libros {
            z-index: 4;
            right: 55px;
            top: 262px;
            width: 245px;
            height: auto;
            filter: brightness(0.78) saturate(0.85);
            transform: rotate(-3deg);
            transform-origin: center bottom;
        }
        #l-cuaderno {
            z-index: 4;
            left: 1080px; top: 525px;
            width: 148px; height: auto;
            transform: rotate(6deg);
            transform-origin: center center;
            filter: brightness(0.78) saturate(0.88);
            transition: filter 2.0s ease;
        }

        /* ══════════════════════════════════════════════
           ANIMACIÓN — CUADERNO: DESTELLO / RESPIRACIÓN LUMINOSA
        ══════════════════════════════════════════════ */
        @keyframes cuadernoGlow {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 0px rgba(200,170,255,0)); }
            50%       { filter: brightness(1.15) drop-shadow(0 0 12px rgba(200,170,255,0.25)); }
        }
        @keyframes cuadernoGlowHvr {
            0%, 100% { filter: brightness(1.1) drop-shadow(0 0 6px rgba(210,180,255,0.30)); }
            50%       { filter: brightness(1.25) drop-shadow(0 0 18px rgba(210,180,255,0.45)); }
        }
        #l-cuaderno.glowing      { animation: cuadernoGlow    3.0s ease-in-out infinite; cursor: pointer !important; pointer-events: auto !important; }
        #l-cuaderno.glowing.hvr  { animation: cuadernoGlowHvr 2.0s ease-in-out infinite; cursor: pointer !important; }

        /* Hotspots escritorio y lámpara */
        #hs-escritorio {
            left: 862px; top: 540px;
            width: 490px; height: 390px;
        }
        #hs-lampara {
            left: 950px; top: 410px;
            width: 200px; height: 210px;
        }
        #hs-rayo {
            left: 950px; top: 490px;
            width: 460px; height: 200px;
        }

        @keyframes deskBreathe {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 0px rgba(155,120,240,0)); }
            50%       { filter: brightness(1.10) drop-shadow(0 0 18px rgba(155,120,240,0.18)); }
        }
        #l-escritorio.s3-breathing     { animation: unifiedBreathe    3.2s ease-in-out infinite; cursor: pointer !important; pointer-events: auto !important; }
        #l-escritorio.s3-breathing.hvr { animation: unifiedBreatheHvr 2.0s ease-in-out infinite; cursor: pointer !important; }
        #l-escritorio.s3-stop {
            animation: none;
            filter: brightness(1);
            transition: filter 1.4s ease;
        }

        /* Indicador de estado del rayo — eliminado */

        /* Hotspot cuaderno */
        #hs-cuaderno {
            left: 1068px; top: 512px;
            width: 175px; height: 220px;
            transform: rotate(6deg);
            transform-origin: center center;
        }

        /* ══════════════════════════════════════════════
           CUADERNO VIEWER OVERLAY
        ══════════════════════════════════════════════ */
        #cuaderno-overlay {
            position: fixed; inset: 0;
            background: rgba(8, 2, 22, 0.55);
            backdrop-filter: blur(14px) brightness(0.7);
            -webkit-backdrop-filter: blur(14px) brightness(0.7);
            z-index: 800;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #cuaderno-overlay.open    { display: flex; }
        #cuaderno-overlay.visible { opacity: 1; }

        #cuaderno-wrap {
            position: relative;
            width: 900px; height: 570px;
            transform-origin: center center;
        }

        .c-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;       /* oculto hasta que JS asigne src */
            object-fit: fill;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }
        .c-layer.loaded { display: block; }
        #c-base    { z-index: 1; }
        #c-current {
            z-index: 2;
            box-shadow: 0 24px 60px rgba(0,0,0,0.65), 0 4px 20px rgba(0,0,0,0.4);
        }

        /* The flipping element — JS sets all properties */
        #c-flip {
            position: absolute;
            top: 0; height: 100%;
            z-index: 5;
            pointer-events: none;
            display: none;
            overflow: hidden;
            background-size: 200% 100%;
        }

        /* Flip keyframe animations */
        @keyframes cCollapseRight {
            0%   { transform: perspective(1400px) rotateY(0deg);
                   box-shadow: 2px 0 0 rgba(0,0,0,0); }
            55%  { transform: perspective(1400px) rotateY(-55deg);
                   box-shadow: -22px 0 38px rgba(0,0,0,0.30); }
            100% { transform: perspective(1400px) rotateY(-90deg);
                   box-shadow: -4px 0 6px rgba(0,0,0,0.10); }
        }
        @keyframes cUnfoldLeft {
            0%   { transform: perspective(1400px) rotateY(90deg);
                   box-shadow: 4px 0 6px rgba(0,0,0,0.10); }
            45%  { transform: perspective(1400px) rotateY(28deg);
                   box-shadow: 22px 0 38px rgba(0,0,0,0.30); }
            100% { transform: perspective(1400px) rotateY(0deg);
                   box-shadow: 2px 0 0 rgba(0,0,0,0); }
        }
        @keyframes cCollapseLeft {
            0%   { transform: perspective(1400px) rotateY(0deg);
                   box-shadow: -2px 0 0 rgba(0,0,0,0); }
            55%  { transform: perspective(1400px) rotateY(55deg);
                   box-shadow: 22px 0 38px rgba(0,0,0,0.30); }
            100% { transform: perspective(1400px) rotateY(90deg);
                   box-shadow: 4px 0 6px rgba(0,0,0,0.10); }
        }
        @keyframes cUnfoldRight {
            0%   { transform: perspective(1400px) rotateY(-90deg);
                   box-shadow: -4px 0 6px rgba(0,0,0,0.10); }
            45%  { transform: perspective(1400px) rotateY(-28deg);
                   box-shadow: -22px 0 38px rgba(0,0,0,0.30); }
            100% { transform: perspective(1400px) rotateY(0deg);
                   box-shadow: -2px 0 0 rgba(0,0,0,0); }
        }

        /* Click zones */
        #c-zone-left, #c-zone-right {
            position: absolute;
            top: 0; width: 50%; height: 100%;
            z-index: 20;
            cursor: pointer;
        }
        #c-zone-left  { left: 0; }
        #c-zone-right { right: 0; }

        /* Arrow hints */
        #c-zone-left::after, #c-zone-right::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            width: 60px;
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
        }
        #c-zone-left::after {
            left: 0;
            background: linear-gradient(to right, rgba(255,255,255,0.06), transparent);
        }
        #c-zone-right::after {
            right: 0;
            background: linear-gradient(to left, rgba(255,255,255,0.06), transparent);
        }
        #c-zone-left:hover::after,
        #c-zone-right:hover::after { opacity: 1; }

        #c-arrow-l, #c-arrow-r {
            position: absolute;
            top: 50%; transform: translateY(-50%);
            z-index: 21;
            font-size: 44px;
            line-height: 1;
            color: rgba(255,255,255,0.08);
            pointer-events: none;
            transition: color 0.3s ease;
            user-select: none;
            opacity: 0;  /* oculto hasta que JS abra el cuaderno */
            transition: opacity 0.4s ease, color 0.3s ease;
        }
        #cuaderno-wrap.ready #c-arrow-l,
        #cuaderno-wrap.ready #c-arrow-r { opacity: 1; }
        #c-arrow-l { left: 10px; }
        #c-arrow-r { right: 10px; }
        #c-zone-left:hover  ~ #c-arrow-l { color: rgba(255,255,255,0.32); }
        #c-zone-right:hover ~ #c-arrow-r { color: rgba(255,255,255,0.32); }

        /* Page counter */
        #c-counter {
            position: absolute;
            bottom: -30px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.20);
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 12px;
            letter-spacing: 0.22em;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            opacity: 0;  /* oculto hasta que JS abra el cuaderno */
            transition: opacity 0.4s ease;
        }
        #cuaderno-wrap.ready #c-counter { opacity: 1; }

        /* Close button */
        #c-close {
            position: fixed;
            top: 22px; right: 28px;
            z-index: 820;
            background: none; border: none; outline: none;
            color: rgba(255,255,255,0.28);
            font-size: 22px;
            cursor: pointer;
            line-height: 1;
            padding: 10px;
            transition: color 0.2s ease, transform 0.2s ease;
        }
        #c-close:hover {
            color: rgba(255,255,255,0.75);
            transform: scale(1.15);
        }

        /* ══════════════════════════════════════════════
           CELULAR EN ESCRITORIO
        ══════════════════════════════════════════════ */
        #l-celular {
            position: absolute;
            z-index: 4;
            left: 1270px; top: 530px;
            width: 60px; height: auto;
        }
        #hs-celular {
            left: 1265px; top: 522px;
            width: 70px; height: 120px;
        }
        /* Locked state: filter gris hasta que se desbloquea */
        #l-celular.locked {
            filter: brightness(0.6) saturate(0.4);
            transition: filter 1.2s ease;
        }
        #l-celular.unlocked {
            filter: brightness(1) saturate(1);
            transition: filter 1.2s ease;
            animation: phoneGlow 3s ease-in-out infinite;
        }
        @keyframes phoneGlow {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 0px rgba(155,200,255,0)); }
            50%       { filter: brightness(1.15) drop-shadow(0 0 12px rgba(155,200,255,0.25)); }
        }

        /* ══════════════════════════════════════════════
           CELULAR OVERLAY — PANTALLA EN PRIMER PLANO
        ══════════════════════════════════════════════ */
        #celular-overlay {
            position: fixed; inset: 0;
            background: rgba(6, 1, 18, 0.55);
            backdrop-filter: blur(14px) brightness(0.65);
            -webkit-backdrop-filter: blur(14px) brightness(0.65);
            z-index: 800;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.45s ease;
        }
        #celular-overlay.open    { display: flex; }
        #celular-overlay.visible { opacity: 1; }

        #phone-frame {
            width: 210px; height: 420px;
            background: #080810;
            border-radius: 36px;
            border: 1.5px solid rgba(255,255,255,0.12);
            box-shadow:
                0 24px 60px rgba(0,0,0,0.85),
                0 0 0 1px rgba(255,255,255,0.06),
                inset 0 1px 0 rgba(255,255,255,0.10);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transform: scale(0.85) translateY(18px);
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.34, 1.36, 0.64, 1), opacity 0.4s ease;
        }
        #celular-overlay.visible #phone-frame {
            transform: scale(1) translateY(0px);
            opacity: 1;
        }

        /* Notch / Dynamic Island */
        #phone-notch {
            position: absolute;
            top: 9px; left: 50%;
            transform: translateX(-50%);
            width: 72px; height: 20px;
            background: #080810;
            border-radius: 14px;
            z-index: 5;
        }

        /* Status bar */
        #phone-status {
            padding: 13px 16px 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: -apple-system, 'SF Pro', sans-serif;
            font-size: 11px;
            color: rgba(255,255,255,0.7);
            flex-shrink: 0;
        }
        #phone-time { font-weight: 600; letter-spacing: 0.02em; }
        #phone-icons-status { display: flex; gap: 5px; align-items: center; }
        .status-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
        }

        /* ── Messaging app ── */
        #phone-screen {
            flex: 1;
            overflow: hidden;
            position: relative;
            background: #0b0016;
        }

        #msg-app {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: #0b0016;
        }

        .msg-view {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            transition: opacity 0.20s ease;
        }
        .msg-view.hidden { opacity: 0; pointer-events: none; }

        .msg-hdr {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            background: #130020;
            flex-shrink: 0;
            min-height: 34px;
        }

        /* Lista de chats */
        .msg-list { flex: 1; overflow-y: auto; scrollbar-width: none; }
        .msg-list::-webkit-scrollbar { display: none; }

        .msg-item {
            display: flex;
            align-items: center;
            padding: 9px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            cursor: pointer;
            gap: 9px;
            transition: background 0.12s ease;
        }
        .msg-item:active { background: rgba(255,255,255,0.04); }

        .msg-av {
            width: 36px; height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .msg-av svg { width: 100%; height: 100%; }

        .msg-item-info { flex: 1; min-width: 0; }
        .msg-item-top  { display: flex; justify-content: space-between; align-items: baseline; }

        .msg-item-name {
            font-family: Georgia, serif;
            font-size: 9.5px;
            color: rgba(255,242,228,0.88);
            letter-spacing: 0.02em;
        }
        .msg-item-time {
            font-family: -apple-system, sans-serif;
            font-size: 7.5px;
            color: rgba(175,135,255,0.55);
            flex-shrink: 0;
            margin-left: 4px;
        }
        .msg-item-preview {
            font-family: -apple-system, sans-serif;
            font-size: 8.5px;
            color: rgba(255,242,228,0.35);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.01em;
        }

        /* Vista de chat */
        .msg-chat-hdr {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            background: #130020;
            flex-shrink: 0;
            min-height: 34px;
        }
        .msg-back {
            font-size: 16px;
            color: rgba(175,135,255,0.75);
            cursor: pointer;
            padding: 1px 5px 1px 0;
            user-select: none;
            line-height: 1;
            font-family: Georgia, serif;
        }
        .msg-back:hover { color: rgba(175,135,255,1); }
        .msg-chat-name {
            font-family: Georgia, serif;
            font-size: 9.5px;
            color: rgba(255,242,228,0.88);
            letter-spacing: 0.04em;
        }
        .msg-av-sm {
            width: 24px; height: 24px;
            border-radius: 50%;
            flex-shrink: 0;
            overflow: hidden;
        }
        .msg-av-sm svg { width: 100%; height: 100%; }

        /* Burbujas */
        .msg-bubbles {
            flex: 1;
            overflow-y: auto;
            padding: 10px 9px 8px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            scrollbar-width: none;
        }
        .msg-bubbles::-webkit-scrollbar { display: none; }

        .msg-row { display: flex; }
        .msg-row.me   { justify-content: flex-end;  }
        .msg-row.them { justify-content: flex-start; }

        .msg-bubble {
            max-width: 76%;
            padding: 5px 8px 4px;
            border-radius: 11px;
            position: relative;
        }
        .msg-bubble.me {
            background: #2e1258;
            border-bottom-right-radius: 3px;
        }
        .msg-bubble.them {
            background: #18082e;
            border-bottom-left-radius: 3px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .msg-btext {
            font-family: -apple-system, sans-serif;
            font-size: 9px;
            line-height: 1.48;
            color: rgba(255,242,228,0.88);
            letter-spacing: 0.01em;
            display: block;
        }
        .msg-bubble.them .msg-btext { color: rgba(255,242,228,0.72); }
        .msg-btime {
            font-family: -apple-system, sans-serif;
            font-size: 6.5px;
            color: rgba(175,135,255,0.42);
            display: block;
            margin-top: 2px;
            text-align: right;
        }
        .msg-row.them .msg-btime { text-align: left; }

        /* Home indicator */
        #phone-home {
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #0e0124, #0a0118);
            flex-shrink: 0;
        }
        #phone-home::after {
            content: '';
            width: 80px; height: 3px;
            background: rgba(255,255,255,0.25);
            border-radius: 2px;
        }

        /* Close celular */
        #celular-close {
            position: fixed;
            top: 22px; right: 28px;
            z-index: 820;
            background: none; border: none; outline: none;
            color: rgba(255,255,255,0.28);
            font-size: 22px;
            cursor: pointer;
            line-height: 1; padding: 10px;
            transition: color 0.2s ease, transform 0.2s ease;
        }
        #celular-close:hover {
            color: rgba(255,255,255,0.75);
            transform: scale(1.15);
        }

        /* ══════════════════════════════════════════════
           PANTALLA INICIO DEL CELULAR
        ══════════════════════════════════════════════ */
        #phone-home-screen {
            position: absolute;
            inset: 0;
            background: linear-gradient(160deg, #0b0020 0%, #0d001a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 18px;
            gap: 0;
        }
        .phone-app-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 10px 14px;
            width: 100%;
        }
        .phone-app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            user-select: none;
        }
        .phone-app-icon-img {
            width: 40px; height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .phone-app-icon:active .phone-app-icon-img {
            transform: scale(0.88);
            filter: brightness(0.85);
        }
        .phone-app-icon-label {
            font-family: -apple-system, sans-serif;
            font-size: 7px;
            color: rgba(255,255,255,0.55);
            letter-spacing: 0.04em;
            text-align: center;
        }

        /* ══════════════════════════════════════════════
           GALERÍA APP
        ══════════════════════════════════════════════ */
        #gallery-app {
            position: absolute;
            inset: 0;
            background: #080810;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        #gallery-app.open {
            opacity: 1;
            pointer-events: auto;
        }
        #gallery-hdr {
            display: flex;
            align-items: center;
            padding: 7px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            background: #0e0020;
            flex-shrink: 0;
            min-height: 32px;
            gap: 7px;
        }
        #gallery-back {
            font-size: 16px;
            color: rgba(175,135,255,0.75);
            cursor: pointer;
            padding: 1px 5px 1px 0;
            user-select: none;
            line-height: 1;
            font-family: Georgia, serif;
        }
        #gallery-back:hover { color: rgba(175,135,255,1); }
        #gallery-title {
            font-family: Georgia, serif;
            font-size: 9px;
            color: rgba(255,242,228,0.75);
            letter-spacing: 0.12em;
            flex: 1;
        }
        #gallery-grid-wrap {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: none;
            padding: 4px;
        }
        #gallery-grid-wrap::-webkit-scrollbar { display: none; }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
        }
        .gallery-thumb {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            cursor: pointer;
            background: #111;
        }
        .gallery-thumb img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.2s ease;
        }
        .gallery-thumb:active img { transform: scale(0.93); }
        .gallery-thumb .vid-badge {
            position: absolute;
            bottom: 3px; right: 3px;
            background: rgba(0,0,0,0.55);
            border-radius: 3px;
            padding: 1px 3px;
            font-size: 6px;
            color: rgba(255,255,255,0.80);
            display: flex;
            align-items: center;
            gap: 1px;
            pointer-events: none;
        }

        /* ── Viewer de foto/video ── */
        #gallery-viewer {
            position: absolute;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s ease;
            z-index: 10;
        }
        #gallery-viewer.open {
            opacity: 1;
            pointer-events: auto;
        }
        #viewer-hdr {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            background: rgba(0,0,0,0.75);
            flex-shrink: 0;
            min-height: 28px;
            gap: 6px;
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 2;
        }
        #viewer-back {
            font-size: 16px;
            color: rgba(255,255,255,0.75);
            cursor: pointer;
            user-select: none;
            font-family: Georgia, serif;
            padding-right: 4px;
        }
        #viewer-counter {
            font-family: -apple-system, sans-serif;
            font-size: 7.5px;
            color: rgba(255,255,255,0.45);
            flex: 1;
            text-align: center;
            letter-spacing: 0.08em;
        }
        #viewer-media {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        #viewer-img {
            max-width: 100%; max-height: 100%;
            object-fit: contain;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }
        #viewer-vid {
            max-width: 100%; max-height: 100%;
            object-fit: contain;
            display: none;
        }
        .viewer-arrow {
            position: absolute;
            top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.35);
            border: none; outline: none;
            color: rgba(255,255,255,0.60);
            font-size: 18px;
            cursor: pointer;
            padding: 10px 5px;
            z-index: 3;
            border-radius: 3px;
            transition: background 0.15s ease;
        }
        .viewer-arrow:hover { background: rgba(0,0,0,0.6); color: #fff; }
        #viewer-prev { left: 2px; }
        #viewer-next { right: 2px; }

        /* ══════════════════════════════════════════════
           FONDO EXTENSO — evita barras negras en zooms
        ══════════════════════════════════════════════ */
        /* Hace el stage impenetrable para mostrar solo contenido del zoomer */
        #s2-stage { overflow: hidden; }

        /* Gran rect con el color de la pared derecha — z-index 0,
           se extiende mucho más allá del stage para cubrir cualquier borde
           visible durante zoom in, sin importar resolución o dirección. */
        #s2-wall-fill {
            position: absolute;
            left: -5000px; top: -5000px;
            width: 12000px; height: 12000px;
            background: #27114e; /* rincón derecho de la habitación */
            z-index: 0;
            pointer-events: none;
        }

        /* ══════════════════════════════════════════════
           BIBLIOTECA Y LIBROS — glow interactivo unificado (s4)
        ══════════════════════════════════════════════ */
        #l-biblioteca.b-breathing       { animation: unifiedBreathe    3.2s ease-in-out infinite; cursor: pointer !important; pointer-events: auto !important; }
        #l-biblioteca.b-breathing.b-hvr { animation: unifiedBreatheHvr 2.0s ease-in-out infinite; cursor: pointer !important; }
        #l-biblioteca.b-stop {
            animation: none;
            filter: brightness(0.82) saturate(0.90);
            transition: filter 1.4s ease;
        }
        #l-libros.b-breathing           { animation: unifiedBreathe    3.2s ease-in-out infinite; cursor: pointer !important; pointer-events: auto !important; }
        #l-libros.b-breathing.b-hvr     { animation: unifiedBreatheHvr 2.0s ease-in-out infinite; cursor: pointer !important; }
        #l-libros.b-stop { animation: none; filter: brightness(0.78) saturate(0.85); }

        /* Hotspot — cubre toda la biblioteca */
        #hs-biblioteca {
            right: -80px; top: 170px;
            width: 640px; height: 510px;
        }

        /* Hotspot — zona de libros interactivos (activo en zoom) */
        #hs-book-1 {
            right: 28px; top: 260px;
            width: 315px; height: 380px;
        }

        /* ══════════════════════════════════════════════
           LIBRO OVERLAY
        ══════════════════════════════════════════════ */
        #libro-overlay {
            position: fixed; inset: 0;
            z-index: 700;
            pointer-events: none;
            opacity: 0;
            display: none;
            align-items: center;
            justify-content: center;
            transition: opacity 1.0s ease;
        }
        #libro-overlay.lb-open {
            display: flex;
        }

        #libro-backdrop {
            position: absolute; inset: 0;
            background: rgba(8, 2, 20, 0.48);
            backdrop-filter: blur(14px) brightness(0.55);
            -webkit-backdrop-filter: blur(14px) brightness(0.55);
        }

        /* ══════════════════════════════════════════════
           LIBRO 3D PHYSICAL ANIMATIONS
        ══════════════════════════════════════════════ */
        #libro-stage {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 2000px;
            transform-style: preserve-3d;
            width: 100vw; height: 100vh;
        }

        .lb-3d-wrap {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            user-select: none;
            -webkit-user-drag: none;
            transform-style: preserve-3d;
            will-change: transform, opacity;
        }
        .lb-3d-wrap.lb-shown { display: block; }

        /* Pivotes físicos desde el lomo del libro */
        #wrap-tapa {
            transform-origin: left center;
        }

        #wrap-abierto {
            transform-origin: center center;
        }

        #wrap-trasera {
            transform-origin: right center;
        }

        /* Tapa delantera */
        #libro-tapa {
            height: 74vh; width: auto;
            max-width: 88vw;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Libro abierto */
        #libro-abierto-wrap {
            position: relative;
            line-height: 0;
        }
        #libro-abierto {
            max-width: 88vw;
            max-height: 74vh;
            width: auto; height: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Tapa trasera */
        #libro-trasera {
            height: 74vh; width: auto;
            max-width: 88vw;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Animaciones 3D físicas de rotación continua desde el lomo */
        @keyframes lbPhysicalOpenFront {
            0%   { transform: translate(-50%, -50%) rotateY(0deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) rotateY(-90deg); opacity: 0.12; }
        }
        @keyframes lbPhysicalUnfoldOpen {
            0%   { transform: translate(-50%, -50%) rotateY(90deg); opacity: 0.12; }
            100% { transform: translate(-50%, -50%) rotateY(0deg); opacity: 1; }
        }
        @keyframes lbPhysicalFoldOpen {
            0%   { transform: translate(-50%, -50%) rotateY(0deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) rotateY(-90deg); opacity: 0.12; }
        }
        @keyframes lbPhysicalCloseBack {
            0%   { transform: translate(-50%, -50%) rotateY(90deg); opacity: 0.12; }
            100% { transform: translate(-50%, -50%) rotateY(0deg); opacity: 1; }
        }

        /* Wash tenue sobre la página izquierda — deshabilitado para evitar recuadros claros */
        #libro-page-wash {
            display: none !important;
        }

        /* Contenedor clickeable de la Sticky Note sobre la página izquierda */
        #libro-sticky-wrapper {
            position: absolute;
            left: 7.5%; top: 11%;
            width: 32.5%; height: auto;
            aspect-ratio: 1 / 1;
            pointer-events: auto;
            z-index: 2;
            filter: drop-shadow(4px 10px 20px rgba(0, 0, 0, 0.40));
            opacity: 0;
            transform: rotate(-2.8deg) scale(0.95);
            transition: opacity 1.0s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), filter 0.35s ease;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }
        #libro-sticky-wrapper.lb-shown {
            opacity: 1;
            transform: rotate(-2.8deg) scale(1);
        }
        #libro-sticky-wrapper:hover {
            transform: rotate(-2.8deg) scale(1.05);
            filter: drop-shadow(6px 14px 28px rgba(0, 0, 0, 0.60));
        }

        /* Imagen del stick note — mix-blend-mode multiply elimina cualquier fondo blanco */
        #libro-hoja-papel {
            width: 100%; height: 100%;
            object-fit: contain;
            display: block;
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        .sn-footer {
            font-size: clamp(4.6px, 0.44vw, 6.6px);
            font-weight: 600;
            color: rgba(30, 20, 0, 0.65);
            text-align: right;
            margin-top: 2px;
        }

        .sn-tag, .sn-text, .sn-subtext, .sn-btn, .sn-footer {
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #libro-info.lb-shown .sn-tag     { opacity: 1; transform: translateY(0); transition-delay: 0.15s; }
        #libro-info.lb-shown .sn-text    { opacity: 1; transform: translateY(0); transition-delay: 0.35s; }
        #libro-info.lb-shown .sn-subtext { opacity: 1; transform: translateY(0); transition-delay: 0.50s; }
        #libro-info.lb-shown .sn-btn     { opacity: 1; transform: translateY(0); transition-delay: 0.65s; }
        #libro-info.lb-shown .sn-footer  { opacity: 1; transform: translateY(0); transition-delay: 0.85s; }
        .li-header {
            font-size: clamp(7px, 0.88vw, 12px);
            font-weight: bold;
            font-style: normal;
            letter-spacing: 0.04em;
            line-height: 1.35;
            color: #150902;
            border-bottom: 0.5px solid rgba(50,26,8,0.22);
            padding-bottom: 0.5em;
            margin: 0 0 0.5em;
        }
        .li-divider {
            width: 22px; height: 0.5px;
            background: rgba(50,26,8,0.28);
            margin: 0.2em 0 0.65em;
        }
        .li-stat {
            font-size: clamp(7.5px, 0.92vw, 12.5px);
            line-height: 1.65;
            font-style: italic;
            margin: 0 0 0.70em;
            color: #1a0f06;
        }
        .li-stat strong {
            font-style: normal;
            font-size: clamp(8.5px, 1.10vw, 14.5px);
            font-weight: bold;
            color: #0f0603;

<script>
/* ═══════════════════════════════════════════════════════════════
   DIEGETIC SOUND DESIGN LAYER — BEDROOM SCENE
   Subtle, intimate, nocturnal, realistic, fragile audio engine
═══════════════════════════════════════════════════════════════ */
var BedroomAudio = (function() {
    'use strict';
    
    var ctx = null;
    var masterGain = null;
    var ambienceNode = null;
    var ambienceFilter = null;
    var humOsc = null;
    var humGain = null;
    var bgMusic = null;
    var bgMusicStarted = false;
    var musicFadingIn = false;
    var musicFadingOut = false;
    var unlocked = false;

    function initCtx() {
        if (ctx) return;
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        ctx = new AudioCtx();
        
        masterGain = ctx.createGain();
        masterGain.gain.setValueAtTime(0.85, ctx.currentTime);
        masterGain.connect(ctx.destination);
    }

    function initBgMusic() {
        if (!bgMusic) {
            bgMusic = new Audio('este.flac');
            bgMusic.preload = 'auto';
            bgMusic.autoplay = true;
            bgMusic.loop = false;
            bgMusic.currentTime = 0;
        }
    }

    function updateAudioBtnUI(isPlaying) {
        var btn = document.getElementById('audio-toggle-btn');
        var iconPlay = document.getElementById('audio-icon-play');
        var iconPause = document.getElementById('audio-icon-pause');
        var btnText = document.getElementById('audio-btn-text');
        
        if (!btn) return;
        if (isPlaying) {
            if (iconPlay) iconPlay.style.display = 'none';
            if (iconPause) iconPause.style.display = 'inline-block';
            if (btnText) btnText.textContent = 'Música';
            btn.classList.add('playing');
            btn.setAttribute('title', 'Pausar Música');
        } else {
            if (iconPlay) iconPlay.style.display = 'inline-block';
            if (iconPause) iconPause.style.display = 'none';
            if (btnText) btnText.textContent = 'Música';
            btn.classList.remove('playing');
            btn.setAttribute('title', 'Reproducir Música');
        }
    }

    function toggleBgMusic() {
        initBgMusic();
        if (!bgMusic) return false;
        
        if (bgMusic.paused) {
            musicFadingOut = false;
            var playPromise = bgMusic.play();
            if (playPromise !== undefined) {
                playPromise.then(function() {
                    bgMusicStarted = true;
                    bgMusic.volume = 0.55;
                    updateAudioBtnUI(true);
                }).catch(function(err){});
            }
            return true;
        } else {
            bgMusic.pause();
            musicFadingIn = false;
            updateAudioBtnUI(false);
            return false;
        }
    }

    function startBgMusic() {
        initBgMusic();
        if (bgMusicStarted || musicFadingOut) return;

        if (bgMusic && (bgMusic.paused || bgMusic.currentTime === 0) && !musicFadingIn) {
            musicFadingIn = true;
            bgMusic.volume = 0;
            var targetVol = 0.55;
            var fadeInDur = 3000;
            var t0 = null;

            var playPromise = bgMusic.play();
            if (playPromise !== undefined) {
                playPromise.then(function() {
                    bgMusicStarted = true;
                    updateAudioBtnUI(true);
                    function step(ts) {
                        if (!t0) t0 = ts;
                        var p = Math.min((ts - t0) / fadeInDur, 1);
                        if (bgMusic) bgMusic.volume = p * targetVol;
                        if (p < 1 && !musicFadingOut) {
                            requestAnimationFrame(step);
                        } else {
                            musicFadingIn = false;
                        }
                    }
                    requestAnimationFrame(step);
                }).catch(function(err) {
                    musicFadingIn = false;
                    updateAudioBtnUI(false);
                });
            }
        }
    }

    function fadeOutBgMusic(durMs, callback) {
        if (!bgMusic || bgMusic.paused) {
            if (callback) callback();
            return;
        }
        musicFadingOut = true;
        var startVol = bgMusic.volume;
        var fadeDur = durMs || 1200;
        var t0 = null;

        function step(ts) {
            if (!t0) t0 = ts;
            var p = Math.min((ts - t0) / fadeDur, 1);
            if (bgMusic) bgMusic.volume = Math.max(0, startVol * (1 - p));
            if (p < 1) {
                requestAnimationFrame(step);
            } else {
                if (bgMusic) bgMusic.pause();
                musicFadingOut = false;
                updateAudioBtnUI(false);
                if (callback) callback();
            }
        }
        requestAnimationFrame(step);
    }

    function unlockAudio() {
        initCtx();
        startBgMusic();
        if (ctx && ctx.state === 'suspended') {
            ctx.resume().then(function() {
                if (!unlocked) {
                    unlocked = true;
                    startRoomAmbience();
                }
            }).catch(function(){});
        } else if (ctx && !unlocked) {
            unlocked = true;
            startRoomAmbience();
        }
    }

    // 1. ROOM AMBIENCE: Subtle room tone (air, distant building ambience, soft electrical presence)
    function startRoomAmbience() {
        if (!ctx || ambienceNode) return;
        var t = ctx.currentTime;

        var bufferSize = ctx.sampleRate * 4;
        var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        var data = buffer.getChannelData(0);
        var lastOut = 0.0;
        for (var i = 0; i < bufferSize; i++) {
            var white = Math.random() * 2 - 1;
            data[i] = (lastOut + (0.02 * white)) / 1.02;
            lastOut = data[i];
        }

        var noise = ctx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;

        ambienceFilter = ctx.createBiquadFilter();
        ambienceFilter.type = 'lowpass';
        ambienceFilter.frequency.setValueAtTime(220, t);
        ambienceFilter.Q.setValueAtTime(1.0, t);

        var ambGain = ctx.createGain();
        ambGain.gain.setValueAtTime(0.018, t);

        humOsc = ctx.createOscillator();
        humGain = ctx.createGain();
        humOsc.type = 'sine';
        humOsc.frequency.setValueAtTime(50, t);
        humGain.gain.setValueAtTime(0.003, t);

        noise.connect(ambienceFilter);
        ambienceFilter.connect(ambGain);
        ambGain.connect(masterGain);

        humOsc.connect(humGain);
        humGain.connect(masterGain);

        noise.start(t);
        humOsc.start(t);

        ambienceNode = noise;
    }

    // 2. BED: Soft mattress & fabric creak
    function playBedSound() {
        if (!ctx) return;
        var t = ctx.currentTime;
        
        var bufSize = Math.floor(ctx.sampleRate * 0.45);
        var buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        var d = buf.getChannelData(0);
        for (var i = 0; i < bufSize; i++) {
            d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / bufSize);
        }
        var noise = ctx.createBufferSource();
        noise.buffer = buf;
        
        var filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(450, t);
        filter.Q.setValueAtTime(1.8, t);
        
        var g = ctx.createGain();
        g.gain.setValueAtTime(0.025, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.42);

        noise.connect(filter);
        filter.connect(g);
        g.connect(masterGain);
        noise.start(t);

        var osc = ctx.createOscillator();
        var og = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(160, t + 0.05);
        osc.frequency.exponentialRampToValueAtTime(120, t + 0.25);
        
        og.gain.setValueAtTime(0.015, t + 0.05);
        og.gain.exponentialRampToValueAtTime(0.0005, t + 0.25);

        osc.connect(og);
        og.connect(masterGain);
        osc.start(t + 0.05);
        osc.stop(t + 0.26);
    }

    // 3. PILLOW: Delicate fabric movement & soft compression
    function playPillowSound() {
        if (!ctx) return;
        var t = ctx.currentTime;

        var bufSize = Math.floor(ctx.sampleRate * 0.5);
        var buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        var d = buf.getChannelData(0);
        for (var i = 0; i < bufSize; i++) {
            var env = Math.sin(Math.PI * (i / bufSize));
            d[i] = (Math.random() * 2 - 1) * env * env;
        }
        var noise = ctx.createBufferSource();
        noise.buffer = buf;

        var filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(950, t);
        filter.frequency.exponentialRampToValueAtTime(650, t + 0.48);
        filter.Q.setValueAtTime(1.4, t);

        var g = ctx.createGain();
        g.gain.setValueAtTime(0.028, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.48);

        noise.connect(filter);
        filter.connect(g);
        g.connect(masterGain);
        noise.start(t);
    }

    // 4. MEDICATION: Subtle blister-pack plastic & tiny pill movement
    function playMedicationSound() {
        if (!ctx) return;
        var t = ctx.currentTime;

        var bufSize = Math.floor(ctx.sampleRate * 0.18);
        var buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        var d = buf.getChannelData(0);
        for (var i = 0; i < bufSize; i++) {
            d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.3));
        }
        var noise = ctx.createBufferSource();
        noise.buffer = buf;

        var filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(4200, t);
        filter.Q.setValueAtTime(3.5, t);

        var g = ctx.createGain();
        g.gain.setValueAtTime(0.022, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);

        noise.connect(filter);
        filter.connect(g);
        g.connect(masterGain);
        noise.start(t);

        [0.04, 0.095].forEach(function(delay, idx) {
            var osc = ctx.createOscillator();
            var og = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1850 + idx * 240, t + delay);
            og.gain.setValueAtTime(0.012, t + delay);
            og.gain.exponentialRampToValueAtTime(0.0005, t + delay + 0.025);
            osc.connect(og);
            og.connect(masterGain);
            osc.start(t + delay);
            osc.stop(t + delay + 0.03);
        });
    }

    // 5. LAMP: Physical switch click + subtle warm electrical hum
    function playLampSound() {
        if (!ctx) return;
        var t = ctx.currentTime;

        var osc = ctx.createOscillator();
        var g = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(680, t);
        osc.frequency.exponentialRampToValueAtTime(220, t + 0.015);
        g.gain.setValueAtTime(0.038, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.018);
        osc.connect(g);
        g.connect(masterGain);
        osc.start(t);
        osc.stop(t + 0.02);

        var hum = ctx.createOscillator();
        var hg = ctx.createGain();
        hum.type = 'sine';
        hum.frequency.setValueAtTime(120, t + 0.015);
        hg.gain.setValueAtTime(0.001, t + 0.015);
        hg.gain.linearRampToValueAtTime(0.018, t + 0.15);
        hg.gain.exponentialRampToValueAtTime(0.0005, t + 1.4);

        hum.connect(hg);
        hg.connect(masterGain);
        hum.start(t + 0.015);
        hum.stop(t + 1.45);
    }

    // 6. DESK: Subtle wooden/fabric movement sound when touching/approaching
    function playDeskSound() {
        if (!ctx) return;
        var t = ctx.currentTime;

        var bufSize = Math.floor(ctx.sampleRate * 0.3);
        var buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        var d = buf.getChannelData(0);
        for (var i = 0; i < bufSize; i++) {
            d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / bufSize);
        }
        var noise = ctx.createBufferSource();
        noise.buffer = buf;

        var filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(320, t);

        var g = ctx.createGain();
        g.gain.setValueAtTime(0.024, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);

        noise.connect(filter);
        filter.connect(g);
        g.connect(masterGain);
        noise.start(t);
    }

    // 7. NOTEBOOK:
    function playPaperFrictionSound() {
        if (!ctx) return;
        var t = ctx.currentTime;

        var bufSize = Math.floor(ctx.sampleRate * 0.2);
        var buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        var d = buf.getChannelData(0);
        for (var i = 0; i < bufSize; i++) {
            d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.4));
        }
        var noise = ctx.createBufferSource();
        noise.buffer = buf;

        var filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1400, t);
        filter.Q.setValueAtTime(2.0, t);

        var g = ctx.createGain();
        g.gain.setValueAtTime(0.018, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.19);

        noise.connect(filter);
        filter.connect(g);
        g.connect(masterGain);
        noise.start(t);
    }

    function playNotebookOpenSound() {
        if (!ctx) return;
        var t = ctx.currentTime;

        var osc = ctx.createOscillator();
        var og = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, t);
        osc.frequency.exponentialRampToValueAtTime(110, t + 0.12);
        og.gain.setValueAtTime(0.022, t);
        og.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        osc.connect(og);
        og.connect(masterGain);
        osc.start(t);
        osc.stop(t + 0.13);

        var bufSize = Math.floor(ctx.sampleRate * 0.35);
        var buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        var d = buf.getChannelData(0);
        for (var i = 0; i < bufSize; i++) {
            d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / bufSize);
        }
        var noise = ctx.createBufferSource();
        noise.buffer = buf;
        var filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1600, t + 0.04);
        filter.frequency.exponentialRampToValueAtTime(900, t + 0.32);
        filter.Q.setValueAtTime(1.5, t + 0.04);

        var g = ctx.createGain();
        g.gain.setValueAtTime(0.025, t + 0.04);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.34);

        noise.connect(filter);
        filter.connect(g);
        g.connect(masterGain);
        noise.start(t + 0.04);
    }

    function playPageTurnSound() {
        if (!ctx) return;
        var t = ctx.currentTime;

        var bufSize = Math.floor(ctx.sampleRate * 0.28);
        var buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        var d = buf.getChannelData(0);
        for (var i = 0; i < bufSize; i++) {
            d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / bufSize);
        }
        var noise = ctx.createBufferSource();
        noise.buffer = buf;

        var filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(2200, t);
        filter.frequency.exponentialRampToValueAtTime(1100, t + 0.26);
        filter.Q.setValueAtTime(2.2, t);

        var g = ctx.createGain();
        g.gain.setValueAtTime(0.024, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.27);

        noise.connect(filter);
        filter.connect(g);
        g.connect(masterGain);
        noise.start(t);
    }

    // 8. PHONE: Subtle muted vibration notification (generic, NOT WhatsApp)
    function playPhoneVibSound() {
        if (!ctx) return;
        var t = ctx.currentTime;

        [0, 0.14].forEach(function(delay) {
            var osc = ctx.createOscillator();
            var g = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(75, t + delay);
            g.gain.setValueAtTime(0.035, t + delay);
            g.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.09);

            osc.connect(g);
            g.connect(masterGain);
            osc.start(t + delay);
            osc.stop(t + delay + 0.095);
        });
    }

    // 9. BOOKSHELF: Quiet wooden resonance & subtle book movement
    function playBookshelfSound() {
        if (!ctx) return;
        var t = ctx.currentTime;

        var osc = ctx.createOscillator();
        var g = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(90, t + 0.25);
        g.gain.setValueAtTime(0.025, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        osc.connect(g);
        g.connect(masterGain);
        osc.start(t);
        osc.stop(t + 0.26);

        var bufSize = Math.floor(ctx.sampleRate * 0.25);
        var buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        var d = buf.getChannelData(0);
        for (var i = 0; i < bufSize; i++) {
            d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / bufSize);
        }
        var noise = ctx.createBufferSource();
        noise.buffer = buf;

        var filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(550, t);
        filter.Q.setValueAtTime(1.5, t);

        var ng = ctx.createGain();
        ng.gain.setValueAtTime(0.018, t);
        ng.gain.exponentialRampToValueAtTime(0.001, t + 0.24);

        noise.connect(filter);
        filter.connect(ng);
        ng.connect(masterGain);
        noise.start(t);
    }

    // 10. BOOK: Soft book movement / opening sound & paper sounds
    function playBookOpenSound() {
        if (!ctx) return;
        var t = ctx.currentTime;

        var bufSize = Math.floor(ctx.sampleRate * 0.4);
        var buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        var d = buf.getChannelData(0);
        for (var i = 0; i < bufSize; i++) {
            d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / bufSize);
        }
        var noise = ctx.createBufferSource();
        noise.buffer = buf;

        var filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1200, t);
        filter.frequency.exponentialRampToValueAtTime(700, t + 0.38);
        filter.Q.setValueAtTime(1.8, t);

        var g = ctx.createGain();
        g.gain.setValueAtTime(0.026, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.38);

        noise.connect(filter);
        filter.connect(g);
        g.connect(masterGain);
        noise.start(t);
    }

    // 11. ZOOM TRANSITIONS: (Desactivado — silencioso, solo foleys de objetos)
    function playZoomSwell(durSec) {}

    // Auto-iniciar la música inmediatamente al cargar la página o en cualquier interacción
    unlockAudio();
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', unlockAudio);
    }
    window.addEventListener('load', unlockAudio);
    ['mousemove', 'pointermove', 'pointerdown', 'mousedown', 'touchstart', 'keydown', 'scroll', 'wheel'].forEach(function(evt) {
        window.addEventListener(evt, unlockAudio, { passive: true });
    });

    // Registrar handler de clic en el botón de audio UI
    function initAudioBtn() {
        var btn = document.getElementById('audio-toggle-btn');
        if (btn) {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();

            });
        }
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initAudioBtn);
    } else {
        initAudioBtn();
    }

    return {
        unlock: unlockAudio,
        toggleBgMusic: toggleBgMusic,
        fadeOutBgMusic: fadeOutBgMusic,
        playBed: playBedSound,
        playPillow: playPillowSound,
        playMedication: playMedicationSound,
        playLamp: playLampSound,
        playDesk: playDeskSound,
        playPaperFriction: playPaperFrictionSound,
        playNotebookOpen: playNotebookOpenSound,
        playPageTurn: playPageTurnSound,
        playPhoneVib: playPhoneVibSound,
        playBookshelf: playBookshelfSound,
        playBookOpen: playBookOpenSound,
        playZoomSwell: playZoomSwell
    };
})();

    /* ════════════════════════════════════════════
       TRANSICIÓN: REMEDIO SE ACERCA A CÁMARA
       Comienza pequeño y de costado (rotado -80°),
       crece hasta el tamaño del GIF mientras se orienta.
       Sin corte visible entre remedio.png y remedio.gif.
    ════════════════════════════════════════════ */
    function startRemedioApproach() {
        var CSS_ROT = 82; /* grados de rotación del remedio acostado en la escena */

        /* Centro del remedio en viewport — getBoundingClientRect() ya incluye la rotación CSS */
        var rect    = lRemedio.getBoundingClientRect();
        var startCX = rect.left + rect.width  / 2;
        var startCY = rect.top  + rect.height / 2;

        /* Aspect ratio natural de Remedio.png */
        var nw     = lRemedio.naturalWidth  || 60;
        var nh     = lRemedio.naturalHeight || 92;
        var aspect = nw / nh;

        /* Tamaño en viewport del elemento SIN rotación (design space × stageScale) */
        var stSc = Math.max(window.innerWidth / 1920, window.innerHeight / 1080);
        var dW   = 60;          /* width en design space */
        var dH   = dW / aspect; /* height proporcional */
        var scrW = dW * stSc;
        var scrH = dH * stSc;

        /* Tamaño destino: igualar exactamente al GIF (88 vh de alto) */
        var vh       = window.innerHeight;
        var targetH  = vh * 0.88;
        var scFactor = targetH / scrH; /* escala total necesaria */

        /* Centro destino = centro del viewport */
        var vw = window.innerWidth;
        var dx = vw / 2 - startCX;
        var dy = vh / 2 - startCY;

        if (remedioSpotlight) remedioSpotlight.classList.add('visible');

        /* Inicializar remedioFg en la misma posición, tamaño y rotación que el remedio */
        remedioFg.style.display  = 'block';
        remedioFg.style.width    = scrW + 'px';
        remedioFg.style.height   = scrH + 'px';
        remedioFg.style.left     = (startCX - scrW / 2) + 'px';
        remedioFg.style.top      = (startCY - scrH / 2) + 'px';
        remedioFg.style.transformOrigin = 'center center';
        remedioFg.style.transform  = 'rotate(' + CSS_ROT + 'deg)';
        remedioFg.style.opacity    = '1';
        remedioFg.style.transition = 'none';

        /* Ocultar el original del stage */
        lRemedio.style.transition = 'none';
        lRemedio.style.opacity    = '0';
        lRemedio.classList.remove('discovered', 'hvr');

        /* GIF: iniciar invisible */
        remedioGif.style.opacity   = '0';
        remedioGif.style.transition = 'none';

        var DUR = 3000;
        var t0  = null;

        function eio(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

        function frame(ts) {
            if (!t0) t0 = ts;
            var t = Math.min((ts - t0) / DUR, 1);
            var e = eio(t);

            /* Escala: crece de 1 a scFactor (tamaño del GIF) */
            var sc  = 1 + (scFactor - 1) * e;
            /* Posición: se mueve al centro */
            var tx  = dx * e;
            var ty  = dy * e;
            /* Rotación: de CSS_ROT grados a 0 (se orienta mientras se acerca) */
            var rot = CSS_ROT * (1 - e);

            remedioFg.style.transform =
                'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px)' +
                ' scale(' + sc.toFixed(4) + ')' +
                ' rotate(' + rot.toFixed(2) + 'deg)';

            /* remedio.png se desvanece entre t=0.45 y t=0.80 */
            var fgA = 1 - Math.max(0, Math.min(1, (t - 0.45) / 0.32));
            remedioFg.style.opacity = Math.max(0, fgA).toFixed(3);

            /* remedio.gif aparece entre t=0.52 y t=0.82, continuando el movimiento */
            if (t >= 0.52) {
                var gifA = Math.min(1, (t - 0.52) / 0.28);
                remedioGif.style.opacity = gifA.toFixed(3);
            }

            if (t < 1) {
                requestAnimationFrame(frame);
            } else {
                remedioFg.style.opacity = '0';
                remedioFg.style.display = 'none';
                remedioGif.style.opacity = '1';
                remedioGif.classList.add('visible');
                state = S.GIF;

                setTimeout(function () {
                    returnHint.classList.add('visible');
                }, 3500);

                remedioGif.addEventListener('click', onReturnClick);
            }
        }

        requestAnimationFrame(function () {
            requestAnimationFrame(function () {
                requestAnimationFrame(frame);
            });
        });
    }

    /* ══════════════════════════════════════════
       VOLVER A LA HABITACIÓN
       GIF fade out → zoom back → bed state
    ══════════════════════════════════════════ */
    function onReturnClick() {

        remedioGif.style.transition = 'opacity 1.0s ease';

        setTimeout(function () {
            /* 2. Mientras el GIF fade: restaurar room elements
